version: 2
enable-beta-ecosystems: true
updates:
  # Update GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    reviewers:
      - "Eduardob3677"
    # Allow beta, RC and dev versions
    allow:
      - dependency-type: "all"
    target-branch: "sixteen"
    # Enable grouped updates (beta feature)
    groups:
      github-actions:
        patterns:
          - "*"

  # Update git submodules
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "submodules"
    commit-message:
      prefix: "chore"
      include: "scope"
    reviewers:
      - "Eduardob3677"
    # Allow beta, RC and dev versions
    allow:
      - dependency-type: "all"
    target-branch: "sixteen"
    ignore:
      # Ignore erofs-utils as it may have breaking changes
      - dependency-name: "external/erofs-utils"
    # Enable grouped updates (beta feature)
    groups:
      submodules:
        patterns:
          - "*"
