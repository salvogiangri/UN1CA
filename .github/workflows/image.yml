name: 🖼️ Build Custom Runner Image

on:
  schedule:
    - cron: "0 21 * * 1-5"  # 04:00 AM Thailand/Vietnam (UTC+7)
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  build-image:
    name: 🖼️ Build Custom Image for ${{ matrix.target }}
    runs-on: rom5
    snapshot: 
        image-name: unica-linux
        version: 1.*
    
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases
    
    permissions:
      contents: write
      actions: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        target: [dm2q]

    steps:
      - name: ⚙️ Configure git
        id: configure-git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 📥 Checkout repository
        id: checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: 🎯 Display workflow information
        id: workflow-info
        run: |
          echo "### 🖼️ Custom Image Build Started" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Device** | \`${{ matrix.target }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Workflow Run** | [\#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

      - name: 🔧 Set up build environment
        id: setup-environment
        run: |
          echo "### 🔧 Setting Up Build Environment" >> $GITHUB_STEP_SUMMARY
          
          echo "::group::⚡ Configuring zRAM (8GB minimum)"
          # Configure zRAM for Ubuntu 24.04
          # Remove default zram configuration if exists
          sudo systemctl stop systemd-zram-setup@zram0.service 2>/dev/null || true
          sudo swapoff /dev/zram0 2>/dev/null || true
          sudo rmmod zram 2>/dev/null || true
          
          # Load zram module and configure
          sudo modprobe zram num_devices=1
          
          # Set size to 8GB (or 90% of RAM if RAM > 9GB)
          TOTAL_RAM=$(free -b | awk '/^Mem:/{print $2}')
          ZRAM_SIZE=$((TOTAL_RAM * 90 / 100))
          MIN_ZRAM_SIZE=$((8 * 1024 * 1024 * 1024))  # 8GB in bytes
          
          # Use the larger of 8GB or 90% of RAM
          if [ $ZRAM_SIZE -lt $MIN_ZRAM_SIZE ]; then
            ZRAM_SIZE=$MIN_ZRAM_SIZE
          fi
          
          echo $ZRAM_SIZE | sudo tee /sys/block/zram0/disksize
          sudo mkswap /dev/zram0
          sudo swapon -p 1000 /dev/zram0  # High priority (1000)
          
          # Verify configuration
          ZRAM_SIZE_HUMAN=$(cat /sys/block/zram0/disksize | numfmt --to=iec-i --suffix=B)
          echo "✅ zRAM configured: $ZRAM_SIZE_HUMAN with priority 1000" >> $GITHUB_STEP_SUMMARY
          echo "::endgroup::"
          
          echo "::group::📦 Installing system packages"
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip attr ccache clang ffmpeg \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip attr ccache clang ffmpeg \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "::endgroup::"
          
          echo "::group::🚀 Configuring ccache"
          # Configure ccache for build acceleration
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR=$HOME/.ccache
          export CCACHE_MAXSIZE=50G
          export CCACHE_COMPRESS=1
          export CCACHE_COMPRESSLEVEL=6
          
          # Set ccache configuration persistently
          ccache --set-config=max_size=50G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --set-config=cache_dir=$HOME/.ccache
          
          # Add ccache configuration to bashrc for persistence
          echo 'export USE_CCACHE=1' >> $HOME/.bashrc
          echo 'export CCACHE_EXEC=$(which ccache)' >> $HOME/.bashrc
          echo 'export CCACHE_DIR=$HOME/.ccache' >> $HOME/.bashrc
          echo 'export CCACHE_MAXSIZE=50G' >> $HOME/.bashrc
          echo 'export CCACHE_COMPRESS=1' >> $HOME/.bashrc
          
          ccache -z  # Zero statistics
          echo "ccache configured: max_size=50G, compression=enabled" >> $GITHUB_STEP_SUMMARY
          echo "::endgroup::"
          
          echo "::group::🔌 Loading kernel modules"
          sudo modprobe erofs f2fs
          echo "::endgroup::"
          
          echo "::group::🔐 Setting up signing keys"
          mkdir -p security/avb
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem
          echo -n "${{ secrets.OTA_KEY_PK8 }}" | base64 --decode > security/unica_ota.pk8
          echo -n "${{ secrets.OTA_KEY_PEM }}" | base64 --decode > security/unica_ota.x509.pem
          echo -n "${{ secrets.AVB_KEY_PEM }}" | base64 --decode > security/avb/unica_avb_rsa4096.pem
          chmod 600 security/*.pk8 security/*.pem security/avb/*.pem
          echo "::endgroup::"
          
          echo "✅ **Environment configured successfully**" >> $GITHUB_STEP_SUMMARY

      - name: ☕ Set up JDK 17
        id: setup-jdk
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: 📦 Update repository
        id: update-repo
        run: |
          echo "### 📦 Updating Repository" >> $GITHUB_STEP_SUMMARY
          echo "::group::Pulling latest changes"
          git pull --no-tags --depth=1
          git submodule update --init --recursive
          echo "::endgroup::"
          echo "✅ **Repository updated**" >> $GITHUB_STEP_SUMMARY
   
      - name: 🧹 Clean old firmware
        id: clean-firmware
        run: |
          echo "### 🧹 Cleaning Old Firmware" >> $GITHUB_STEP_SUMMARY
          echo "::group::Removing old firmware and build artifacts"
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/cleanup.sh all 
          ./scripts/cleanup.sh fw
          ./scripts/cleanup.sh tools
          ./scripts/cleanup.sh work_dir
          echo "::endgroup::"
          echo "✅ **Old firmware cleaned**" >> $GITHUB_STEP_SUMMARY

      - name: 🔨 Build dependencies
        id: build-dependencies
        run: |
          echo "### 🔨 Building Dependencies" >> $GITHUB_STEP_SUMMARY
          echo "::group::Building build system dependencies"
          source ./buildenv.sh a52sxq
          ./scripts/build_dependencies.sh
          echo "::endgroup::"
          echo "✅ **Dependencies built successfully**" >> $GITHUB_STEP_SUMMARY

      - name: 📥 Download stock firmware
        id: download-firmware
        run: |
          echo "### 📥 Downloading Stock Firmware" >> $GITHUB_STEP_SUMMARY
          echo "::group::Downloading firmware files for ${{ matrix.target }}"
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh
          echo "::endgroup::"
          echo "✅ **Firmware downloaded successfully**" >> $GITHUB_STEP_SUMMARY

      - name: 📦 Extract stock firmware
        id: extract-firmware
        run: |
          echo "### 📦 Extracting Firmware" >> $GITHUB_STEP_SUMMARY
          echo "::group::Extracting firmware components"
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh
          echo "::endgroup::"
          echo "✅ **Firmware extracted successfully**" >> $GITHUB_STEP_SUMMARY

      - name: 💾 Save custom image snapshot
        id: save-snapshot
        run: |
          echo "### 💾 Saving Custom Image" >> $GITHUB_STEP_SUMMARY
          echo "::group::Creating snapshot of configured environment"
          
          # Show final ccache stats
          if command -v ccache &> /dev/null; then
            echo "Final ccache statistics:"
            ccache -s
          fi
          
          # Show zRAM configuration
          if [ -b /dev/zram0 ]; then
            ZRAM_SIZE=$(cat /sys/block/zram0/disksize 2>/dev/null | numfmt --to=iec-i --suffix=B 2>/dev/null || echo "unknown")
            echo "zRAM configured: $ZRAM_SIZE with priority 1000"
          fi
          
          echo "Custom image 'unica-linux' will be saved automatically by the runner"
          echo "All dependencies, firmware, and build tools are now ready"
          echo "::endgroup::"
          echo "✅ **Custom image snapshot created**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| System Packages | ✅ Installed |" >> $GITHUB_STEP_SUMMARY
          echo "| zRAM (≥8GB, priority 1000) | ✅ Configured |" >> $GITHUB_STEP_SUMMARY
          echo "| ccache (50GB) | ✅ Configured |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Dependencies | ✅ Compiled |" >> $GITHUB_STEP_SUMMARY
          echo "| Stock Firmware | ✅ Downloaded & Extracted |" >> $GITHUB_STEP_SUMMARY
          echo "| Signing Keys | ✅ Configured |" >> $GITHUB_STEP_SUMMARY

      - name: 🎉 Image build completed
        id: image-summary
        if: success()
        run: |
          echo "### 🎊 Custom Image Build Completed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The custom runner image has been built and is ready for ROM compilation." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 **Next: Triggering ROM build workflow...**" >> $GITHUB_STEP_SUMMARY

  trigger-build:
    name: 🚀 Trigger ROM Build
    needs: build-image
    runs-on: ubuntu-latest
    if: success()
    
    permissions:
      contents: read
      actions: write
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🚀 Trigger build.yml workflow
        uses: actions/github-script@v7
        with:
          script: |
            console.log('Triggering build.yml workflow...');
            
            const result = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: context.ref,
            });
            
            console.log('Build workflow triggered successfully!');
            
            core.summary
              .addHeading('🚀 ROM Build Triggered', 3)
              .addRaw('The ROM build workflow has been triggered automatically.')
              .addEOL()
              .addRaw('Check the [Actions tab](/' + context.repo.owner + '/' + context.repo.repo + '/actions) to monitor the build progress.')
              .write();
