name: 🖼️ Build Custom Runner Image

on:
  schedule:
    - cron: "0 21 * * 1-5"  # 04:00 AM Thailand/Vietnam (UTC+7)
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  build-image:
    name: 🖼️ Build Custom Image for ${{ matrix.target }}
    runs-on: rom4
    snapshot: 
        image-name: unica-linux
        version: 1.*
    
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases
    
    permissions:
      contents: write
      actions: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        target: [dm2q]

    steps:
      - name: ⚙️ Configure git
        id: configure-git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 📥 Checkout repository
        id: checkout
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: 🎯 Display workflow information
        id: workflow-info
        run: |
          echo "### 🖼️ Custom Image Build Started" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Device** | \`${{ matrix.target }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Workflow Run** | [\#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

      - name: 🔧 Set up build environment
        id: setup-environment
        run: |
          echo "### 🔧 Setting Up Build Environment" >> $GITHUB_STEP_SUMMARY
          
          echo "::group::📦 Installing build dependencies"
          sudo apt update
          # Install essential build tools and dependencies for Android ROM compilation
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip attr ccache clang ffmpeg zram-config \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev x11proto-core-dev libx11-dev tree lib32z-dev \
            libgl1-mesa-dev libxml2-utils xsltproc bc lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev lz4 tar \
            libxml2 lzop pngcrush schedtool squashfs-tools imagemagick \
            libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev python3 \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp zram-tools
          
          # Display installed versions
          echo "✅ Build dependencies installed" >> $GITHUB_STEP_SUMMARY
          echo "  - GCC: $(gcc --version | head -n1)" >> $GITHUB_STEP_SUMMARY
          echo "  - Python: $(python3 --version)" >> $GITHUB_STEP_SUMMARY
          echo "  - ccache: $(ccache --version | head -n1)" >> $GITHUB_STEP_SUMMARY
          echo "::endgroup::"
          
          echo "::group::⚡ Configuring zRAM for Ubuntu 24.04 (8GB minimum)"
          # Configure zRAM for Ubuntu 24.04
          # Remove default zram configuration if exists
          sudo sh -c 'cat > /etc/default/zramswap <<EOF
          ENABLED=true
          ALGO=zstd
          PERCENTAGE=50
          PRIORITY=100
          EOF'
          sudo systemctl enable zramswap
          sudo systemctl start zramswap
          sudo zramctl
          
          # Configure ccache for build acceleration
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache --max-size=50G
          ccache -o compression=true
          export CC="ccache gcc"
          export CXX="ccache g++"
          
          # Add ccache configuration to bashrc for persistence
          echo 'export USE_CCACHE=1' >> $HOME/.bashrc
          echo 'export CCACHE_EXEC=/usr/bin/ccache' >> $HOME/.bashrc
          echo 'export CC="ccache gcc"' >> $HOME/.bashrc
          echo 'export CXX="ccache g++"' >> $HOME/.bashrc
          
          # Initialize ccache statistics
          ccache -z
          
          # Display ccache configuration
          echo "✅ ccache configured for Ubuntu 24.04" >> $GITHUB_STEP_SUMMARY
          echo "  - Executable: /usr/bin/ccache" >> $GITHUB_STEP_SUMMARY
          echo "  - Max size: 50G" >> $GITHUB_STEP_SUMMARY
          echo "  - Compression: enabled" >> $GITHUB_STEP_SUMMARY
          echo "  - CC wrapper: ccache gcc" >> $GITHUB_STEP_SUMMARY
          echo "  - CXX wrapper: ccache g++" >> $GITHUB_STEP_SUMMARY
          ccache -s
          echo "::endgroup::"
          
          echo "::group::🔌 Loading kernel modules"
          sudo modprobe erofs f2fs
          echo "::endgroup::"
          
          
          echo "✅ **Environment configured successfully for Ubuntu 24.04**" >> $GITHUB_STEP_SUMMARY

      - name: ☕ Set up JDK 17
        id: setup-jdk
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
             
      - name: 🧹 Clean old firmware
        id: clean-firmware
        run: |
          echo "### 🧹 Cleaning Old Firmware" >> $GITHUB_STEP_SUMMARY
          echo "::group::Removing old firmware and build artifacts"
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/cleanup.sh all 
          ./scripts/cleanup.sh fw
          ./scripts/cleanup.sh tools
          ./scripts/cleanup.sh work_dir
          git add -A
          git commit -m "cleanup"
          echo "::endgroup::"
          echo "✅ **Old firmware cleaned**" >> $GITHUB_STEP_SUMMARY

      - name: 🔨 Build dependencies
        id: build-dependencies
        run: |
          echo "### 🔨 Building Dependencies" >> $GITHUB_STEP_SUMMARY
          echo "::group::Building build system dependencies"
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh
          git add -A
          git commit -m "dependencies"
          echo "::endgroup::"
          echo "✅ **Dependencies built successfully**" >> $GITHUB_STEP_SUMMARY

      - name: 📥 Download stock firmware
        id: download-firmware
        run: |
          echo "### 📥 Downloading Stock Firmware" >> $GITHUB_STEP_SUMMARY
          echo "::group::Downloading firmware files for ${{ matrix.target }}"
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh
          git add -A
          git commit -m "fw"
          echo "::endgroup::"
          echo "✅ **Firmware downloaded successfully**" >> $GITHUB_STEP_SUMMARY

      - name: 📦 Extract stock firmware
        id: extract-firmware
        run: |
          echo "### 📦 Extracting Firmware" >> $GITHUB_STEP_SUMMARY
          echo "::group::Extracting firmware components"
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh
          git add -A
          git commit -m "extract"
          echo "::endgroup::"
          echo "✅ **Firmware extracted successfully**" >> $GITHUB_STEP_SUMMARY

      - name: 💾 Save custom image snapshot
        id: save-snapshot
        run: |
          echo "### 💾 Saving Custom Image" >> $GITHUB_STEP_SUMMARY
          echo "::group::Creating snapshot of configured environment"
          
          # Show final ccache stats
          if command -v ccache &> /dev/null; then
            echo "Final ccache statistics:"
            ccache -s
          fi
          
          # Show zRAM configuration
          sudo zramctl

          
          echo ""
          echo "Custom image 'unica-linux' will be saved automatically by the runner"
          echo "All dependencies, firmware, and build tools are now ready"
          echo "::endgroup::"
          echo "✅ **Custom image snapshot created for Ubuntu 24.04**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ubuntu Version | ✅ 24.04 LTS |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Dependencies | ✅ All installed (gcc, g++, python3, etc.) |" >> $GITHUB_STEP_SUMMARY
          echo "| zRAM (≥8GB, priority 1000) | ✅ Configured |" >> $GITHUB_STEP_SUMMARY
          echo "| ccache (50GB) | ✅ Configured with wrappers |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Tools | ✅ Compiled |" >> $GITHUB_STEP_SUMMARY
          echo "| Stock Firmware | ✅ Downloaded & Extracted |" >> $GITHUB_STEP_SUMMARY
          echo "| Signing Keys | ✅ Configured |" >> $GITHUB_STEP_SUMMARY

      - name: 🎉 Image build completed
        id: image-summary
        if: success()
        run: |
          echo "### 🎊 Custom Image Build Completed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The custom runner image has been built and is ready for ROM compilation." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 **Next: Triggering ROM build workflow...**" >> $GITHUB_STEP_SUMMARY
