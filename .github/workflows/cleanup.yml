name: 🧹 Cleanup - Actions History, PRs & Issues

on:
  workflow_dispatch:
    inputs:
      clean_workflow_runs:
        description: 'Clean workflow runs history'
        required: false
        default: 'true'
        type: boolean
      close_pull_requests:
        description: 'Close all open pull requests'
        required: false
        default: 'true'
        type: boolean
      close_issues:
        description: 'Close all open issues'
        required: false
        default: 'true'
        type: boolean
      delete_copilot_branches:
        description: 'Delete branches with "copilot" in the name'
        required: false
        default: 'true'
        type: boolean

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  cleanup:
    name: 🧹 Cleanup Repository
    runs-on: Ubuntu-latest
    
    steps:
      - name: 📋 Display cleanup plan
        id: cleanup-plan
        run: |
          echo "### 🧹 Cleanup Plan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Task | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Clean Workflow Runs | ${{ inputs.clean_workflow_runs && '✅ Enabled' || '❌ Disabled' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Close Pull Requests | ${{ inputs.close_pull_requests && '✅ Enabled' || '❌ Disabled' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Close Issues | ${{ inputs.close_issues && '✅ Enabled' || '❌ Disabled' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Delete Copilot Branches | ${{ inputs.delete_copilot_branches && '✅ Enabled' || '❌ Disabled' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

      - name: 🗑️ Clean workflow runs history
        id: clean-workflows
        if: inputs.clean_workflow_runs == true
        env:
          GH_TOKEN: ${{ secrets.TEST }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          echo "### 🗑️ Cleaning Workflow Runs" >> $GITHUB_STEP_SUMMARY
          echo "::group::Fetching workflow runs"
          echo "Current run ID: $CURRENT_RUN_ID (will be excluded from deletion)"

          # Get all workflows
          workflows=$(gh api repos/$REPO/actions/workflows --jq '.workflows[] | .id')
          
          total_deleted=0
          total_skipped=0
          total_skipped_running=0
          
          for workflow_id in $workflows; do
            echo "Processing workflow ID: $workflow_id"
            
            # Get all runs for this workflow with their status and conclusion
            runs=$(gh api repos/$REPO/actions/workflows/$workflow_id/runs --paginate --jq '.workflow_runs[] | "\(.id)|\(.status)|\(.conclusion)"')
            
            for run_info in $runs; do
              run_id=$(echo "$run_info" | cut -d'|' -f1)
              run_status=$(echo "$run_info" | cut -d'|' -f2)
              run_conclusion=$(echo "$run_info" | cut -d'|' -f3)
              
              # Skip the current run
              if [ "$run_id" = "$CURRENT_RUN_ID" ]; then
                echo "⏭️ Skipping run ID: $run_id (current workflow run)"
                total_skipped=$((total_skipped + 1))
                continue
              fi
              
              # Skip running workflows
              if [ "$run_status" = "in_progress" ] || [ "$run_status" = "queued" ] || [ "$run_status" = "waiting" ]; then
                echo "⏭️ Skipping run ID: $run_id (status: $run_status - still running)"
                total_skipped_running=$((total_skipped_running + 1))
                continue
              fi
              
              # Delete workflows with cancelled or skipped status regardless of artifacts
              if [ "$run_conclusion" = "cancelled" ] || [ "$run_conclusion" = "skipped" ]; then
                echo "Deleting run ID: $run_id (conclusion: $run_conclusion)"
                if gh api repos/$REPO/actions/runs/$run_id -X DELETE 2>/dev/null; then
                  total_deleted=$((total_deleted + 1))
                else
                  echo "⚠️ Failed to delete run ID: $run_id (may already be deleted)"
                fi
              else
                # For other statuses, check if it has artifacts before deleting
                artifacts_count=$(gh api repos/$REPO/actions/runs/$run_id/artifacts --jq '.total_count' 2>/dev/null || echo "0")
                
                if [ "$artifacts_count" -gt 0 ]; then
                  echo "⏭️ Skipping run ID: $run_id (has $artifacts_count artifact(s))"
                  total_skipped=$((total_skipped + 1))
                else
                  echo "Deleting run ID: $run_id (conclusion: $run_conclusion)"
                  if gh api repos/$REPO/actions/runs/$run_id -X DELETE 2>/dev/null; then
                    total_deleted=$((total_deleted + 1))
                  else
                    echo "⚠️ Failed to delete run ID: $run_id (may already be deleted)"
                  fi
                fi
              fi
            done
          done
          
          echo "::endgroup::"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Deleted $total_deleted workflow runs**" >> $GITHUB_STEP_SUMMARY
          echo "⏭️ **Skipped $total_skipped workflow runs with artifacts**" >> $GITHUB_STEP_SUMMARY
          echo "⏭️ **Skipped $total_skipped_running running workflow runs**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: 🔒 Close and delete all pull requests
        id: close-prs
        if: inputs.close_pull_requests == true
        env:
          GH_TOKEN: ${{ secrets.TEST }}
          REPO: ${{ github.repository }}
        run: |
          echo "### 🔒 Closing and Deleting Pull Requests" >> $GITHUB_STEP_SUMMARY
          echo "::group::Fetching all pull requests"
          
          # Get the default branch to avoid deleting it
          default_branch=$(gh api repos/$REPO --jq '.default_branch')
          
          # Get all PRs (both open and closed) with their state and head branch
          prs=$(gh api repos/$REPO/pulls?state=all --paginate --jq '.[] | (.number|tostring) + "|" + .state + "|" + (.head.ref // "")')
          
          total_closed=0
          total_already_closed=0
          total_branches_deleted=0
          total_branches_skipped=0
          
          for pr_info in $prs; do
            pr_number=$(echo "$pr_info" | cut -d'|' -f1)
            pr_state=$(echo "$pr_info" | cut -d'|' -f2)
            pr_branch=$(echo "$pr_info" | cut -d'|' -f3)
            
            echo "Processing PR #$pr_number (state: $pr_state, branch: $pr_branch)"
            
            # Close the PR if it's open
            if [ "$pr_state" = "open" ]; then
              # Add a comment to the PR first
              gh api repos/$REPO/issues/$pr_number/comments \
                -f body="🤖 This pull request was automatically closed by the cleanup workflow." \
                2>/dev/null && \
                echo "✅ Added comment to PR #$pr_number" || \
                echo "⚠️ Failed to add comment to PR #$pr_number"
              
              # Close the PR
              if gh api repos/$REPO/pulls/$pr_number -X PATCH -f state=closed 2>/dev/null; then
                total_closed=$((total_closed + 1))
                echo "✅ Closed PR #$pr_number"
              else
                echo "⚠️ Failed to close PR #$pr_number"
              fi
            else
              echo "⏭️ PR #$pr_number already closed"
              total_already_closed=$((total_already_closed + 1))
            fi
            
            # Delete the head branch if it exists and is not the default branch
            if [ -n "$pr_branch" ] && [ "$pr_branch" != "null" ]; then
              # Skip if it's the default branch
              if [ "$pr_branch" = "$default_branch" ]; then
                echo "⏭️ Skipping branch: $pr_branch (default branch)"
                total_branches_skipped=$((total_branches_skipped + 1))
              else
                echo "Deleting branch: $pr_branch"
                if gh api repos/$REPO/git/refs/heads/$pr_branch -X DELETE 2>/dev/null; then
                  total_branches_deleted=$((total_branches_deleted + 1))
                  echo "✅ Deleted branch: $pr_branch"
                else
                  echo "⚠️ Failed to delete branch: $pr_branch (may not exist or protected)"
                fi
              fi
            fi
          done
          
          echo "::endgroup::"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Closed $total_closed pull requests**" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ **$total_already_closed pull requests were already closed**" >> $GITHUB_STEP_SUMMARY
          echo "🗑️ **Deleted $total_branches_deleted branches**" >> $GITHUB_STEP_SUMMARY
          if [ $total_branches_skipped -gt 0 ]; then
            echo "⏭️ **Skipped $total_branches_skipped branches**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: 🔒 Close all issues
        id: close-issues
        if: inputs.close_issues == true
        env:
          GH_TOKEN: ${{ secrets.TEST }}
          REPO: ${{ github.repository }}
        run: |
          echo "### 🔒 Closing Issues" >> $GITHUB_STEP_SUMMARY
          echo "::group::Fetching all issues"
          
          # Get all issues (both open and closed, excluding PRs) with their state
          issues=$(gh api repos/$REPO/issues?state=all --paginate --jq '.[] | select(.pull_request == null) | "\(.number)|\(.state)"')
          
          total_closed=0
          total_already_closed=0
          
          for issue_info in $issues; do
            issue_number=$(echo "$issue_info" | cut -d'|' -f1)
            issue_state=$(echo "$issue_info" | cut -d'|' -f2)
            
            echo "Processing issue #$issue_number (state: $issue_state)"
            
            # Close the issue if it's open
            if [ "$issue_state" = "open" ]; then
              # Add a comment to the issue first
              gh api repos/$REPO/issues/$issue_number/comments \
                -f body="🤖 This issue was automatically closed by the cleanup workflow." \
                2>/dev/null && \
                echo "✅ Added comment to issue #$issue_number" || \
                echo "⚠️ Failed to add comment to issue #$issue_number"
              
              # Close the issue
              if gh api repos/$REPO/issues/$issue_number -X PATCH \
                -f state=closed -f state_reason=not_planned 2>/dev/null; then
                total_closed=$((total_closed + 1))
                echo "✅ Closed issue #$issue_number"
              else
                echo "⚠️ Failed to close issue #$issue_number"
              fi
            else
              echo "⏭️ Issue #$issue_number already closed"
              total_already_closed=$((total_already_closed + 1))
            fi
          done
          
          echo "::endgroup::"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Closed $total_closed issues**" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ **$total_already_closed issues were already closed**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: 🌿 Delete copilot branches
        id: delete-copilot-branches
        if: inputs.delete_copilot_branches == true
        env:
          GH_TOKEN: ${{ secrets.TEST }}
          REPO: ${{ github.repository }}
        run: |
          echo "### 🌿 Deleting Copilot Branches" >> $GITHUB_STEP_SUMMARY
          echo "::group::Fetching branches with 'copilot' in name"
          
          # Get all branches that contain "copilot" in the name
          branches=$(gh api repos/$REPO/git/refs/heads --paginate --jq '.[] | select(.ref | contains("copilot")) | .ref' | sed 's/refs\/heads\///')
          
          total_deleted=0
          total_skipped=0
          
          # Get the default branch to avoid deleting it
          default_branch=$(gh api repos/$REPO --jq '.default_branch')
          
          for branch in $branches; do
            # Skip if it's the default branch
            if [ "$branch" = "$default_branch" ]; then
              echo "⏭️ Skipping branch: $branch (default branch)"
              total_skipped=$((total_skipped + 1))
              continue
            fi
            
            echo "Deleting branch: $branch"
            
            # Delete the branch
            if gh api repos/$REPO/git/refs/heads/$branch -X DELETE 2>/dev/null; then
              total_deleted=$((total_deleted + 1))
              echo "✅ Deleted branch: $branch"
            else
              echo "⚠️ Failed to delete branch: $branch (may not exist or protected)"
            fi
          done
          
          echo "::endgroup::"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Deleted $total_deleted branches with 'copilot' in name**" >> $GITHUB_STEP_SUMMARY
          if [ $total_skipped -gt 0 ]; then
            echo "⏭️ **Skipped $total_skipped branches**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: 🎉 Cleanup completed
        id: cleanup-summary
        if: success()
        run: |
          echo "### 🎊 Cleanup Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **All requested cleanup tasks have been completed.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** This workflow used the TEST token for authentication." >> $GITHUB_STEP_SUMMARY
