name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

env:
  GITHUB_TOKEN: ${{ secrets.TEST2 }}
  GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.TEST2 }}

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: Unica

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      contents: read
      actions: read

    # Steps run before the agent starts working
    steps:
      - name: Checkout
        uses: actions/checkout@master # v6.0.0

      - uses: actions/download-artifact@v5
        with:
          artifact-ids: 4669005837
          github-token: ${{ secrets.TEST2 }} # token with actions:read permissions on target repo
          repository: extremerom/DumprX
          run-id: 19657597840
    
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install MCP Server Dependencies
        run: |
          # Install MCP servers globally to make them available for Copilot
          for package in \
            "@modelcontextprotocol/server-filesystem" \
            "@modelcontextprotocol/server-github" \
            "@modelcontextprotocol/server-sequential-thinking" \
            "@modelcontextprotocol/server-memory" \
            "@modelcontextprotocol/server-puppeteer"; do
            echo "Installing $package..."
            npm install -g "$package" || echo "Warning: Failed to install $package"
          done
          unzip *.zip
