name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

env:
  GITHUB_TOKEN: ${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN }}
  GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN }}

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      contents: read

    # Steps run before the agent starts working
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.0 # v6.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install MCP Server Dependencies
        run: |
          # Pre-install MCP servers using timeout to cache packages
          # Each server is started briefly (30s) which allows npx to download,
          # cache, and initialize the package before timing out
          for package in \
            "@modelcontextprotocol/server-filesystem" \
            "@modelcontextprotocol/server-github" \
            "@modelcontextprotocol/server-sequential-thinking" \
            "@modelcontextprotocol/server-git" \
            "@modelcontextprotocol/server-memory" \
            "@modelcontextprotocol/server-playwright"; do
            timeout 30s npx -y "$package" || true
          done
