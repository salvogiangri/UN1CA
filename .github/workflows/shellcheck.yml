name: Shellcheck

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'sixteen'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq shellcheck

      - name: Run shellcheck
        run: |
          CODE=0

          while IFS= read -r f; do
              shellcheck "$f" || true
              STATUS=$?

              if [[ "$STATUS" != "0" ]]; then
                  CODE=$STATUS
              fi
          done < <(find platform scripts target unica -type f -name "*.sh")

          exit $CODE
