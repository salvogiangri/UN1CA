name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'sixteen'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Run shellcheck
        run: |
          CODE=0
          while IFS= read -r f; do
            shellcheck -e SC1090,SC1091 -s bash "$f" || CODE=1
          done < <(find platform scripts target unica -name "*.sh" -not -name "*ssi.sh" -not -name "config.sh" -not -name "sff.sh")
          exit $CODE

  generate-matrix:
    name: Generate matrix
    needs: shellcheck
    runs-on: ubuntu-24.04

    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Generate CI matrix
        id: generate-matrix
        run: |
          matrix="$(find target -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: [shellcheck, generate-matrix]
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate build config
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        run: ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: ./scripts/extract_fw.sh

      - name: Build ROM
        run: ./scripts/make_rom.sh
