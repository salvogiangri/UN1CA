name: Update prebuilt external tools

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"
    
permissions:
  checks: write
  id-token: write   # This is required for requesting the JWT
  contents: write  # This is required for actions/checkout
  security-events: write
  pull-requests: write
  issues: write
  
jobs:
  update:
    runs-on: Ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip attr ccache clang ffmpeg \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build external tools
        run: |
          echo "=== Starting build process ==="
          rm -rf out
          git rm -r out
          git commit -m "delete prebuilt tools"
          source ./buildenv.sh a52sxq
          ./scripts/build_dependencies.sh
          echo "TOOLS_VERSION=$(date -u +"%Y%m%d")" >> "$GITHUB_ENV"
          
          echo "=== Git status after build ==="
          git status
          git diff --name-status
          git add out
          git commit -m "update prebuilt tools"
          git push

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            out/bin
            out/venv
          commit-message: 'prebuilts/external: update tools to ${{ env.TOOLS_VERSION }}'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          branch: 'prebuilts/external-tools'
          delete-branch: true
          title: 'Update prebuilt external tools'
          body: ''
        
      - name: Log workflow status
        if: always()
        run: |
          echo "=== Workflow Execution Summary ==="
          echo "Timestamp: $(date -u)"
          echo "Tools Version: ${{ env.TOOLS_VERSION }}"
          echo "Changes Detected: ${{ steps.check_changes.outputs.has_changes }}"
          echo "Workflow Status: ${{ job.status }}"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ env.TOOLS_VERSION }}-${{ github.run_id }}
          path: |
            build.log
            *.log
            out/
          retention-days: 7
