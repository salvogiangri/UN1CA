name: 🔨 Build UN1CA ROM

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  build:
    name: 🔨 Build ROM for ${{ matrix.target }}
    runs-on: rom4
    
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases
    
    permissions:
      contents: write
      actions: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        target: [dm2q]

    steps:
      - name: 🔄 Update repository
        id: update-repo
        run: |
          echo "### 🔄 Updating Repository" >> $GITHUB_STEP_SUMMARY
          echo "::group::Pulling latest changes"
          git pull
          echo "::endgroup::"
          echo "✅ **Repository updated with latest changes**" >> $GITHUB_STEP_SUMMARY

      - name: 🎯 Display workflow information
        id: workflow-info
        run: |
          echo "### 🔨 ROM Build Started" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Device** | \`${{ matrix.target }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Workflow Run** | [\#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

      - name: 🔨 Build ROM
        id: build-rom
        run: |
          echo "### 🔨 Building UN1CA ROM" >> $GITHUB_STEP_SUMMARY
          echo "::group::Compiling ROM for ${{ matrix.target }}"
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh
          echo "::endgroup::"
          echo "✅ **ROM built successfully**" >> $GITHUB_STEP_SUMMARY

      - name: 📋 Get ROM version and filename
        id: rom_info
        run: |
          echo "### 📋 ROM Information" >> $GITHUB_STEP_SUMMARY
          echo "::group::Reading ROM version and file information"
          source ./buildenv.sh ${{ matrix.target }}
          source ./unica/configs/version.sh
          echo "rom_version=$ROM_VERSION" >> "$GITHUB_OUTPUT"
          ZIP_FILE=$(find out/ -maxdepth 1 -type f -name "UN1CA_*.zip" -print -quit)
          if [ -n "$ZIP_FILE" ]; then
            echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
            echo "zip_name=$(basename "$ZIP_FILE")" >> "$GITHUB_OUTPUT"
            echo "::endgroup::"
            
            # Add to summary
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| **ROM Version** | \`$ROM_VERSION\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Filename** | \`$(basename "$ZIP_FILE")\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **File Size** | \`$(du -h "$ZIP_FILE" | cut -f1)\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "::endgroup::"
            echo "::error::No ZIP file found in out/ directory"
            exit 1
          fi

      - name: ⬆️ Upload ROM artifact
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: UN1CA-${{ matrix.target }}-${{ steps.rom_info.outputs.rom_version }}
          path: ${{ steps.rom_info.outputs.zip_file }}
          retention-days: 30
          if-no-files-found: error

      - name: 🎉 Build completed
        id: build-summary
        if: success()
        run: |
          echo "### 🎊 ROM Build Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **The ROM build has been completed and the artifact has been uploaded.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 Download the artifact from the workflow run page." >> $GITHUB_STEP_SUMMARY

  release:
    name: 📦 Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_name == 'sixteen'
    
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases
    
    permissions:
      contents: write
      actions: write
      id-token: write

    steps:
      - name: 📥 Checkout repository
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 📋 Get version information
        id: version
        run: |
          echo "### 📋 Release Information" >> $GITHUB_STEP_SUMMARY
          echo "::group::Reading version information"
          source ./unica/configs/version.sh
          echo "rom_version=$ROM_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$ROM_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`$ROM_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`v$ROM_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Date** | \`$(date +'%Y-%m-%d')\` |" >> $GITHUB_STEP_SUMMARY

      - name: ⬇️ Download all build artifacts
        id: download-artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: ☁️ Upload all ROMs to Google Drive
        id: upload-all-gdrive
        uses: adityak74/google-drive-upload-git-action@v0.3
        with:
          credentials: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          filename: "release-artifacts/**/*.zip"
          folderId: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          overwrite: "true"
          mirrorDirectoryStructure: "false"

      - name: 📝 Generate download links
        id: generate-links
        run: |
          echo "### 📝 Generating Google Drive download links" >> $GITHUB_STEP_SUMMARY
          
          # Create download link for the folder
          FOLDER_URL="https://drive.google.com/drive/folders/${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}"
          echo "folder_url=$FOLDER_URL" >> "$GITHUB_OUTPUT"
          
          # Create a list of files with links for the release notes
          FILE_LIST=""
          for file in $(find release-artifacts -type f -name "*.zip"); do
            filename=$(basename "$file")
            # Format: - filename (link to folder since we don't have individual file IDs)
            FILE_LIST="${FILE_LIST}- ${filename}\n"
          done
          
          # Save the file list
          echo "file_list<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$FILE_LIST" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📂 Folder URL: $FOLDER_URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Files uploaded:" >> $GITHUB_STEP_SUMMARY
          echo -e "$FILE_LIST" >> $GITHUB_STEP_SUMMARY

      - name: 🚀 Create GitHub release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: UN1CA ${{ steps.version.outputs.rom_version }} - ${{ steps.version.outputs.release_date }}
          body: |
            ## UN1CA ${{ steps.version.outputs.rom_version }}

            ### Build Information
            - **Version**: ${{ steps.version.outputs.rom_version }}
            - **Build Date**: ${{ steps.version.outputs.release_date }}
            - **Commit**: ${{ github.sha }}

            ### Download
            📥 **Download ROMs from Google Drive**
            
            The following ROM files are available in the Google Drive folder:
            ${{ steps.generate-links.outputs.file_list }}
            
            🔗 [Open Google Drive Folder](${{ steps.generate-links.outputs.folder_url }})

            ### Supported Devices
            - Galaxy S23+ (dm2qxxx)

            ### Installation
            1. Download the appropriate ZIP file for your device from Google Drive
            2. Boot into recovery mode
            3. Flash the ZIP file
            4. Reboot and enjoy!

            ### Notes
            - Make sure to backup your data before flashing
            - Firmware files are signed and ready to flash

          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🎉 Release completed
        id: release-summary
        if: success()
        run: |
          echo "### 🎊 Release Published Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **The release has been published to GitHub.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Release](https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.release_tag }})" >> $GITHUB_STEP_SUMMARY
